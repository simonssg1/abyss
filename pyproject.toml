[project]
name = "abyss"
version = "1.0.0"
description = "Changeur de voix temps réel (macOS / Windows) — effets DSP, IA RVC en v2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "pedalboard>=0.9",
    "PySide6>=6.6",
    "pynput>=1.7",
]

[project.scripts]
abyss = "abyss.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abyss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
