<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3B5E"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="470" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06D6A0" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#06D6A0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#06D6A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F8FF"/>
      <stop offset="1" stop-color="#A9B6F5"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06D6A0"/>
      <stop offset="1" stop-color="#2BB5B8"/>
    </linearGradient>
  </defs>
  <!-- fond : carré arrondi sombre -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#355070" stroke-opacity="0.6" stroke-width="6"/>
  <!-- halo léger -->
  <circle cx="512" cy="470" r="400" fill="url(#halo)"/>
  <!-- arcs turquoise de part et d'autre -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round" stroke-width="40">
    <path d="M 300 330 A 230 230 0 0 0 300 610"/>
    <path d="M 220 270 A 320 320 0 0 0 220 670"/>
    <path d="M 724 330 A 230 230 0 0 1 724 610"/>
    <path d="M 804 270 A 320 320 0 0 1 804 670"/>
  </g>
  <!-- micro -->
  <path d="M 382 470 A 130 130 0 0 0 642 470" fill="none" stroke="#C7D0FA" stroke-width="30" stroke-linecap="round"/>
  <rect x="432" y="210" width="160" height="320" rx="80" fill="url(#capsule)"/>
  <rect x="496" y="600" width="32" height="110" rx="14" fill="#C7D0FA"/>
  <rect x="412" y="700" width="200" height="36" rx="18" fill="#C7D0FA"/>
</svg>
