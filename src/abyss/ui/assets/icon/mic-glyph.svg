<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F7FF"/>
      <stop offset="1" stop-color="#A9B6F5"/>
    </linearGradient>
    <linearGradient id="holder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06D6A0"/>
      <stop offset="1" stop-color="#3FA7C9"/>
    </linearGradient>
  </defs>
  <!-- barres latérales (niveaux) -->
  <g fill="#06D6A0">
    <rect x="8" y="50" width="9" height="28" rx="4.5"/>
    <rect x="22" y="40" width="9" height="48" rx="4.5"/>
    <rect x="97" y="40" width="9" height="48" rx="4.5"/>
    <rect x="111" y="50" width="9" height="28" rx="4.5"/>
  </g>
  <!-- support en U -->
  <path d="M38 62 a26 26 0 0 0 52 0" fill="none" stroke="url(#holder)" stroke-width="8" stroke-linecap="round"/>
  <!-- capsule -->
  <rect x="46" y="10" width="36" height="72" rx="18" fill="url(#capsule)"/>
  <!-- pied -->
  <rect x="60" y="88" width="8" height="18" rx="3" fill="#C7D0FA"/>
  <rect x="44" y="104" width="40" height="8" rx="4" fill="#C7D0FA"/>
</svg>
